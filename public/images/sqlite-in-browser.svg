<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --value-text: #1e293b; --text-sub: #64748b; --arrow: #94a3b8; --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --value-text: #f1f5f9; --text-sub: #94a3b8; --arrow: #64748b; --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="sib-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
    <marker id="sib-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="680" height="220" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="26" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">DATABASE SERVER vs SQLITE DI BROWSER</text>

  <!-- Traditional client-server -->
  <g filter="url(#sib-shadow)">
    <rect x="30" y="46" width="290" height="150" rx="12" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
  </g>
  <text x="175" y="72" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="700">Client &#8594; Server DB</text>
  <rect x="55" y="90" width="80" height="50" rx="8" fill="none" stroke="var(--value-text)" stroke-width="1.5"/>
  <text x="95" y="119" text-anchor="middle" fill="var(--value-text)" font-size="10">Browser</text>
  <line x1="135" y1="115" x2="215" y2="115" stroke="var(--arrow)" stroke-width="2" marker-end="url(#sib-arrow)"/>
  <line x1="215" y1="125" x2="135" y2="125" stroke="var(--arrow)" stroke-width="2" marker-end="url(#sib-arrow)"/>
  <text x="175" y="108" text-anchor="middle" fill="var(--text-sub)" font-size="8">network</text>
  <rect x="215" y="90" width="80" height="50" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="112" text-anchor="middle" fill="#dc2626" font-size="10">MySQL/</text>
  <text x="255" y="126" text-anchor="middle" fill="#dc2626" font-size="10">Postgres</text>
  <text x="175" y="170" text-anchor="middle" fill="var(--text-sub)" font-size="10">Butuh server terpisah,</text>
  <text x="175" y="184" text-anchor="middle" fill="var(--text-sub)" font-size="10">latensi jaringan tiap query</text>

  <!-- sql.js in browser -->
  <g filter="url(#sib-shadow)">
    <rect x="360" y="46" width="290" height="150" rx="12" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
  </g>
  <text x="505" y="72" text-anchor="middle" fill="#059669" font-size="13" font-weight="700">sql.js di Browser</text>
  <rect x="400" y="90" width="210" height="55" rx="8" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="505" y="112" text-anchor="middle" fill="var(--value-text)" font-size="10">Browser</text>
  <text x="505" y="130" text-anchor="middle" fill="#059669" font-size="10" font-family="'JetBrains Mono', monospace">SQLite (WASM) + data</text>
  <text x="505" y="170" text-anchor="middle" fill="var(--text-sub)" font-size="10">Semua berjalan lokal,</text>
  <text x="505" y="184" text-anchor="middle" fill="var(--text-sub)" font-size="10">instan, tanpa round-trip jaringan</text>
</svg>
