<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --value-text: #1e293b; --text-sub: #64748b; --arrow: #94a3b8; --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --value-text: #f1f5f9; --text-sub: #94a3b8; --arrow: #64748b; --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="wf-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="680" height="240" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="24" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">WHERE harga &gt; 80000 — SETIAP BARIS DIPERIKSA</text>

  <!-- Input rows -->
  <text x="100" y="52" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">SEMUA BARIS</text>
  <g font-family="'JetBrains Mono', monospace" font-size="10">
    <rect x="40" y="62" width="120" height="26" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
    <text x="100" y="79" text-anchor="middle" fill="var(--value-text)">harga: 68000</text>
    <rect x="40" y="94" width="120" height="26" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
    <text x="100" y="111" text-anchor="middle" fill="var(--value-text)">harga: 85000</text>
    <rect x="40" y="126" width="120" height="26" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
    <text x="100" y="143" text-anchor="middle" fill="var(--value-text)">harga: 89000</text>
    <rect x="40" y="158" width="120" height="26" rx="6" fill="var(--card-bg)" stroke="var(--card-border)"/>
    <text x="100" y="175" text-anchor="middle" fill="var(--value-text)">harga: 55000</text>
  </g>

  <!-- WHERE gate -->
  <g filter="url(#wf-shadow)">
    <rect x="280" y="60" width="120" height="130" rx="12" fill="var(--card-bg)" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="340" y="90" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">WHERE</text>
  <text x="340" y="108" text-anchor="middle" fill="var(--value-text)" font-size="10" font-family="'JetBrains Mono', monospace">harga &gt; 80000</text>
  <text x="340" y="140" text-anchor="middle" fill="var(--text-sub)" font-size="20">?</text>
  <text x="340" y="170" text-anchor="middle" fill="var(--text-sub)" font-size="9">benar &#8594; lolos</text>
  <text x="340" y="182" text-anchor="middle" fill="var(--text-sub)" font-size="9">salah &#8594; dibuang</text>

  <line x1="160" y1="75" x2="278" y2="72" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#wf-arrow)"/>
  <line x1="160" y1="107" x2="278" y2="95" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#wf-arrow)"/>
  <line x1="160" y1="139" x2="278" y2="120" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#wf-arrow)"/>
  <line x1="160" y1="171" x2="278" y2="145" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Passed -->
  <text x="560" y="52" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">LOLOS (hasil)</text>
  <rect x="500" y="62" width="120" height="26" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="560" y="79" text-anchor="middle" fill="#059669" font-size="10" font-family="'JetBrains Mono', monospace">harga: 85000</text>
  <rect x="500" y="94" width="120" height="26" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="560" y="111" text-anchor="middle" fill="#059669" font-size="10" font-family="'JetBrains Mono', monospace">harga: 89000</text>

  <line x1="400" y1="90" x2="498" y2="75" stroke="#10b981" stroke-width="1.5" marker-end="url(#wf-arrow)"/>
  <line x1="400" y1="110" x2="498" y2="107" stroke="#10b981" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Discarded -->
  <text x="560" y="150" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="700">DIBUANG</text>
  <rect x="500" y="160" width="120" height="26" rx="6" fill="#ef4444" fill-opacity="0.10" stroke="#ef4444" stroke-dasharray="3 3"/>
  <text x="560" y="177" text-anchor="middle" fill="#dc2626" font-size="10" font-family="'JetBrains Mono', monospace" opacity="0.7">68000, 55000</text>
  <line x1="400" y1="150" x2="498" y2="172" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#wf-arrow)"/>
</svg>
