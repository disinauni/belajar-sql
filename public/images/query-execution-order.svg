<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --value-text: #1e293b; --text-sub: #64748b; --arrow: #94a3b8; --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --value-text: #f1f5f9; --text-sub: #94a3b8; --arrow: #64748b; --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="qe-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
    <marker id="qe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="680" height="240" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="24" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">URUTAN EVALUASI QUERY SQL (LOGIS)</text>

  <!-- 5 stage pipeline -->
  <!-- FROM -->
  <g filter="url(#qe-shadow)">
    <rect x="20" y="60" width="112" height="70" rx="10" fill="var(--card-bg)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="76" y="88" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">FROM</text>
  <text x="76" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="9">pilih tabel</text>
  <text x="76" y="150" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">1</text>

  <line x1="132" y1="95" x2="150" y2="95" stroke="var(--arrow)" stroke-width="2" marker-end="url(#qe-arrow)"/>

  <!-- WHERE -->
  <g filter="url(#qe-shadow)">
    <rect x="154" y="60" width="112" height="70" rx="10" fill="var(--card-bg)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="210" y="88" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">WHERE</text>
  <text x="210" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="9">saring baris</text>
  <text x="210" y="150" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">2</text>

  <line x1="266" y1="95" x2="284" y2="95" stroke="var(--arrow)" stroke-width="2" marker-end="url(#qe-arrow)"/>

  <!-- SELECT -->
  <g filter="url(#qe-shadow)">
    <rect x="288" y="60" width="112" height="70" rx="10" fill="var(--card-bg)" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="344" y="88" text-anchor="middle" fill="#059669" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">SELECT</text>
  <text x="344" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="9">pilih kolom</text>
  <text x="344" y="150" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">3</text>

  <line x1="400" y1="95" x2="418" y2="95" stroke="var(--arrow)" stroke-width="2" marker-end="url(#qe-arrow)"/>

  <!-- ORDER BY -->
  <g filter="url(#qe-shadow)">
    <rect x="422" y="60" width="122" height="70" rx="10" fill="var(--card-bg)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="483" y="88" text-anchor="middle" fill="#d97706" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">ORDER BY</text>
  <text x="483" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="9">urutkan</text>
  <text x="483" y="150" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">4</text>

  <line x1="544" y1="95" x2="562" y2="95" stroke="var(--arrow)" stroke-width="2" marker-end="url(#qe-arrow)"/>

  <!-- LIMIT -->
  <g filter="url(#qe-shadow)">
    <rect x="566" y="60" width="94" height="70" rx="10" fill="var(--card-bg)" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <text x="613" y="88" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace">LIMIT</text>
  <text x="613" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="9">batasi</text>
  <text x="613" y="150" text-anchor="middle" fill="var(--text-sub)" font-size="10" font-weight="700">5</text>

  <text x="340" y="188" text-anchor="middle" fill="var(--text-sub)" font-size="10">Urutan PENULISAN: SELECT ... FROM ... WHERE ... ORDER BY ... LIMIT ...</text>
  <text x="340" y="206" text-anchor="middle" fill="var(--text-sub)" font-size="10">Urutan EVALUASI (di atas): FROM &#8594; WHERE &#8594; SELECT &#8594; ORDER BY &#8594; LIMIT</text>
</svg>
