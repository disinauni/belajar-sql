<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --value-text: #1e293b; --text-sub: #64748b; --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --value-text: #f1f5f9; --text-sub: #94a3b8; --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="cd-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
  </defs>

  <rect width="680" height="220" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="24" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">CONSTRAINT: PENJAGA GERBANG DATA</text>

  <g filter="url(#cd-shadow)">
    <rect x="180" y="44" width="320" height="150" rx="12" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
  </g>
  <text x="340" y="66" text-anchor="middle" fill="var(--value-text)" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">CREATE TABLE anggota (</text>

  <text x="200" y="88" font-size="10" font-family="'JetBrains Mono', monospace" fill="var(--value-text)">id INTEGER </text>
  <text x="290" y="88" font-size="10" font-family="'JetBrains Mono', monospace" fill="#3b82f6" font-weight="700">PRIMARY KEY</text>
  <text x="500" y="88" font-size="9" fill="#2563eb" text-anchor="end">unik</text>

  <text x="200" y="106" font-size="10" font-family="'JetBrains Mono', monospace" fill="var(--value-text)">nama TEXT </text>
  <text x="280" y="106" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ef4444" font-weight="700">NOT NULL</text>
  <text x="500" y="106" font-size="9" fill="#dc2626" text-anchor="end">wajib diisi</text>

  <text x="200" y="124" font-size="10" font-family="'JetBrains Mono', monospace" fill="var(--value-text)">email TEXT </text>
  <text x="285" y="124" font-size="10" font-family="'JetBrains Mono', monospace" fill="#8b5cf6" font-weight="700">UNIQUE</text>
  <text x="500" y="124" font-size="9" fill="#7c3aed" text-anchor="end">tak boleh sama</text>

  <text x="200" y="142" font-size="10" font-family="'JetBrains Mono', monospace" fill="var(--value-text)">status TEXT </text>
  <text x="290" y="142" font-size="10" font-family="'JetBrains Mono', monospace" fill="#f59e0b" font-weight="700">DEFAULT 'aktif'</text>
  <text x="500" y="142" font-size="9" fill="#d97706" text-anchor="end">nilai otomatis</text>

  <text x="200" y="160" font-size="10" font-family="'JetBrains Mono', monospace" fill="var(--value-text)">umur INTEGER </text>
  <text x="300" y="160" font-size="10" font-family="'JetBrains Mono', monospace" fill="#10b981" font-weight="700">CHECK (umur&gt;=10)</text>
  <text x="500" y="160" font-size="9" fill="#059669" text-anchor="end">validasi nilai</text>

  <text x="340" y="180" text-anchor="middle" fill="var(--value-text)" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace">);</text>

  <text x="340" y="210" text-anchor="middle" fill="var(--text-sub)" font-size="9">INSERT yang melanggar constraint manapun akan DITOLAK otomatis</text>
</svg>
