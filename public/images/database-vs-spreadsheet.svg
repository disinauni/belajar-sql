<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --inner-bg: #f1f5f9; --inner-border: #cbd5e1; --value-text: #1e293b; --text-sub: #64748b;
        --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --inner-bg: #0f172a; --inner-border: #475569; --value-text: #f1f5f9; --text-sub: #94a3b8;
          --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="dvs-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
    <linearGradient id="dvs-g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="dvs-g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="680" height="220" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="26" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">SPREADSHEET vs DATABASE</text>

  <!-- Spreadsheet card -->
  <g filter="url(#dvs-shadow)">
    <rect x="30" y="42" width="290" height="158" rx="12" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
  </g>
  <rect x="30" y="42" width="290" height="10" rx="5" fill="url(#dvs-g1)"/>
  <text x="175" y="72" text-anchor="middle" fill="#d97706" font-size="14" font-weight="700">Spreadsheet</text>
  <!-- loose grid -->
  <g stroke="var(--inner-border)" stroke-width="1.5" fill="var(--inner-bg)">
    <rect x="55" y="86" width="240" height="90" rx="6"/>
    <line x1="55" y1="116" x2="295" y2="116"/>
    <line x1="55" y1="146" x2="295" y2="146"/>
    <line x1="135" y1="86" x2="135" y2="176"/>
    <line x1="215" y1="86" x2="215" y2="176"/>
  </g>
  <text x="95" y="107" text-anchor="middle" fill="var(--value-text)" font-size="11">85000</text>
  <text x="175" y="137" text-anchor="middle" fill="#ef4444" font-size="11">"delapan"</text>
  <text x="255" y="167" text-anchor="middle" fill="var(--value-text)" font-size="11">72000</text>
  <text x="175" y="192" text-anchor="middle" fill="var(--text-sub)" font-size="10">Tipe data bebas, gampang salah ketik</text>

  <!-- Database card -->
  <g filter="url(#dvs-shadow)">
    <rect x="360" y="42" width="290" height="158" rx="12" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
  </g>
  <rect x="360" y="42" width="290" height="10" rx="5" fill="url(#dvs-g2)"/>
  <text x="505" y="72" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="700">Database</text>
  <g stroke="var(--inner-border)" stroke-width="1.5" fill="var(--inner-bg)">
    <rect x="385" y="86" width="240" height="90" rx="6"/>
    <line x1="385" y1="116" x2="625" y2="116"/>
    <line x1="385" y1="146" x2="625" y2="146"/>
    <line x1="465" y1="86" x2="465" y2="176"/>
    <line x1="545" y1="86" x2="545" y2="176"/>
  </g>
  <text x="425" y="107" text-anchor="middle" fill="var(--value-text)" font-size="11" font-family="'JetBrains Mono', monospace">85000</text>
  <text x="505" y="137" text-anchor="middle" fill="var(--value-text)" font-size="11" font-family="'JetBrains Mono', monospace">68000</text>
  <text x="585" y="167" text-anchor="middle" fill="var(--value-text)" font-size="11" font-family="'JetBrains Mono', monospace">72000</text>
  <text x="505" y="192" text-anchor="middle" fill="var(--text-sub)" font-size="10">Tipe data ketat — kolom harga selalu angka</text>
</svg>
