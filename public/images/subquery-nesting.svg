<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      :root {
        --bg: #f8fafc; --border: #e2e8f0; --card-bg: #ffffff; --card-border: #e2e8f0;
        --value-text: #1e293b; --text-sub: #64748b; --arrow: #94a3b8; --shadow: rgba(0,0,0,0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a; --border: #1e293b; --card-bg: #1e293b; --card-border: #334155;
          --value-text: #f1f5f9; --text-sub: #94a3b8; --arrow: #64748b; --shadow: rgba(0,0,0,0.4);
        }
      }
    </style>
    <filter id="sn-shadow"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="var(--shadow)"/></filter>
    <marker id="sn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="680" height="220" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="340" y="24" text-anchor="middle" fill="var(--text-sub)" font-size="11" font-weight="600" letter-spacing="0.5">SUBQUERY DIEVALUASI LEBIH DULU</text>

  <!-- Inner query -->
  <g filter="url(#sn-shadow)">
    <rect x="60" y="50" width="240" height="80" rx="10" fill="var(--card-bg)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="180" y="72" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">1. Subquery (dalam)</text>
  <text x="180" y="94" text-anchor="middle" fill="var(--value-text)" font-size="10" font-family="'JetBrains Mono', monospace">SELECT AVG(harga)</text>
  <text x="180" y="110" text-anchor="middle" fill="var(--value-text)" font-size="10" font-family="'JetBrains Mono', monospace">FROM buku</text>

  <line x1="180" y1="130" x2="180" y2="150" stroke="var(--arrow)" stroke-width="2" marker-end="url(#sn-arrow)"/>
  <text x="220" y="145" fill="var(--text-sub)" font-size="9">hasil: 82916.67</text>

  <!-- Result bubble -->
  <circle cx="180" cy="168" r="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="180" y="172" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="700">82917</text>

  <line x1="220" y1="168" x2="380" y2="168" stroke="var(--arrow)" stroke-width="2" marker-end="url(#sn-arrow)"/>

  <!-- Outer query -->
  <g filter="url(#sn-shadow)">
    <rect x="390" y="130" width="260" height="76" rx="10" fill="var(--card-bg)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="520" y="152" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700">2. Query Luar</text>
  <text x="520" y="174" text-anchor="middle" fill="var(--value-text)" font-size="10" font-family="'JetBrains Mono', monospace">SELECT judul FROM buku</text>
  <text x="520" y="190" text-anchor="middle" fill="var(--value-text)" font-size="10" font-family="'JetBrains Mono', monospace">WHERE harga &gt; 82917</text>

  <text x="340" y="40" text-anchor="middle" fill="var(--text-sub)" font-size="9">Nilai dari subquery "disuntikkan" ke kondisi WHERE query luar</text>
</svg>
